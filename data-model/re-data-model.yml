  - name: PointsSeason
    description: A Re Points season with a public leaderboard and earning opportunities.
    fields: [season, leaderboard, opportunities]
  - name: Wallet
    description: An onchain address holding Re tokens and accruing points.
    fields: [address, balance, points, rank]
relationships:
