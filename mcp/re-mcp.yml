server:
  name: re-protocol
  transport: http
  url: https://api.re.xyz/mcp
  authentication: none
description: >-
  Official hosted Re Protocol MCP server. Exposes all data served by the public
  Re Protocol API (https://api.re.xyz) as MCP tools. Installable in Claude Code,
  Gemini CLI, Codex CLI, Cursor, VS Code, and the Claude UI.
install:
  claude_code: claude mcp add --transport http re-protocol https://api.re.xyz/mcp
  gemini_cli: gemini mcp add --transport http re-protocol https://api.re.xyz/mcp
  codex_cli: codex mcp add re-protocol -- npx -y mcp-remote https://api.re.xyz/mcp
tools:
