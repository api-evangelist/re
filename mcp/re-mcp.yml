    description: Current APY and NAV for reUSD and reUSDe.
    source_operation: openapi/re-openapi.yml#getApy
  - name: get_price
    description: Historical daily price and APY series since inception.
    source_operation: openapi/re-openapi.yml#getPrice
  - name: get_supply
    description: Supply data for both tokens.
    source_operation: openapi/re-openapi.yml#getSupply
  - name: get_tvl
    description: Latest values of every protocol capital/TVL metric.
    source_operation: openapi/re-openapi.yml#getTvl
  - name: get_tvl_history
    description: Historical values of every TVL metric.
    source_operation: openapi/re-openapi.yml#getTvlHistory
  - name: get_points_leaderboard
    description: Public Re Points leaderboard.
    source_operation: openapi/re-openapi.yml#getPointsLeaderboard
  - name: get_points_opportunities
    description: Live earning opportunities with boost multipliers.
    source_operation: openapi/re-openapi.yml#getPointsOpportunities
  - name: get_wallet_balance
    description: A wallet's reUSD and reUSDe holdings across chains.
    source_operation: openapi/re-openapi.yml#getWalletBalance
  - name: get_wallet_points
    description: A wallet's accumulated points and leaderboard position.
    source_operation: openapi/re-openapi.yml#getWalletPoints
