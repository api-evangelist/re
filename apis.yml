aid: re
name: Re
description: >-
  Re (Re Protocol) is an onchain reinsurance platform that channels stablecoin
  capital into fully collateralized, regulated reinsurance contracts. It issues
  two yield-bearing tokens — reUSD, the senior tranche, and reUSDe, the
  mezzanine tranche — backed by real reinsurance premiums from a diversified book
  (homeowners, commercial and personal auto, small business, and workers
  compensation). Re describes itself as "the internet capital market for
  insurance risk," giving onchain participants access to the ~$800B global
  reinsurance market with onchain attestations, audits, and a transparent loss
  waterfall. Re operates a public, read-only HTTP API (https://api.re.xyz)
  serving APY/NAV, price history, token supply, protocol TVL, the Re Points
  leaderboard, and per-wallet data, plus a hosted MCP server that exposes the
  same data to AI agents. Backed by Electric Capital.
